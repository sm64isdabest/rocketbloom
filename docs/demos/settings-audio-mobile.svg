<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Prévia mobile das configurações de áudio do RocketBloom</title>
  <desc id="desc">Painel responsivo com abas e quatro cartões empilhados para música, efeitos sonoros, sons da interface e silêncio geral.</desc>
  <defs>
    <linearGradient id="space" x2="0" y2="1"><stop stop-color="#02091a"/><stop offset=".56" stop-color="#061438"/><stop offset="1" stop-color="#0b1743"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#061536" stop-opacity=".94"/><stop offset="1" stop-color="#030b26" stop-opacity=".98"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#0a2456"/><stop offset="1" stop-color="#061535"/></linearGradient>
    <linearGradient id="track" x2="1"><stop stop-color="#729cff"/><stop offset="55%" stop-color="#729cff"/><stop offset="55%" stop-color="#0a3c9d"/><stop offset="1" stop-color="#0a3c9d"/></linearGradient>
    <linearGradient id="switch" x2="1"><stop stop-color="#a8c6ff"/><stop offset="1" stop-color="#4b77ca"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#space)"/>
  <g opacity=".42" filter="url(#blur)"><circle cx="196" cy="304" r="44" fill="#27b456"/><circle cx="224" cy="264" r="26" fill="#ed4b56"/><circle cx="296" cy="378" r="19" fill="#447bff"/></g>
  <rect x="14" y="18" width="362" height="808" rx="22" fill="url(#panel)" stroke="#078eff" stroke-width="4" filter="url(#glow)"/>
  <path d="M38 46l12-14 15 14 14-14 12 14-14 14 14 14-12 13-14-14-15 14-12-13 14-14z" fill="#d82024" stroke="#ff6b55" stroke-width="3" stroke-linejoin="round"/>
  <path d="M43 50l32 32M75 50L43 82" stroke="#a80f18" stroke-width="7" stroke-linecap="round"/>
  <rect x="36" y="110" width="318" height="48" rx="12" fill="#030d27" stroke="#264674"/>
  <rect x="40" y="115" width="69" height="38" rx="8" fill="#1c4a8c" stroke="#7ab8ff"/>
  <g font-family="Arial, sans-serif" font-size="9.5" font-weight="600" fill="#a9bad9" text-anchor="middle"><text x="74" y="139" fill="#f2f7ff">Áudio</text><text x="143" y="139">Jogabilidade</text><text x="225" y="139">Acessibilidade</text><text x="316" y="139">Informações</text></g>
  <g font-family="Arial, sans-serif">
    <g><rect x="34" y="174" width="322" height="124" rx="14" fill="url(#card)" stroke="#315b91"/><rect x="46" y="187" width="28" height="28" rx="8" fill="#174078" stroke="#3867a1"/><text x="60" y="207" font-size="16" text-anchor="middle">🎵</text><text x="84" y="199" fill="#f4f7ff" font-size="15" font-weight="700">Música</text><text x="342" y="199" fill="#a9c9ff" font-size="11" text-anchor="end">35%</text><text x="84" y="220" fill="#b2c5e4" font-size="10">Trilha ambiente das suas viagens espaciais.</text><rect x="84" y="248" width="258" height="22" rx="11" fill="url(#track)"/><circle cx="174" cy="259" r="10" fill="url(#switch)" stroke="#c1d8ff" stroke-width="2"/><text x="84" y="286" fill="#8fa9d6" font-size="8.5">0%</text><text x="342" y="286" fill="#8fa9d6" font-size="8.5" text-anchor="end">100%</text></g>
    <g><rect x="34" y="309" width="322" height="124" rx="14" fill="url(#card)" stroke="#315b91"/><rect x="46" y="322" width="28" height="28" rx="8" fill="#174078" stroke="#3867a1"/><text x="60" y="342" font-size="16" text-anchor="middle">✨</text><text x="84" y="334" fill="#f4f7ff" font-size="15" font-weight="700">Efeitos sonoros</text><text x="342" y="334" fill="#a9c9ff" font-size="11" text-anchor="end">55%</text><text x="84" y="355" fill="#b2c5e4" font-size="10">Moedas, obstáculos, poderes e conquistas.</text><rect x="84" y="383" width="258" height="22" rx="11" fill="url(#track)"/><circle cx="226" cy="394" r="10" fill="url(#switch)" stroke="#c1d8ff" stroke-width="2"/><text x="84" y="421" fill="#8fa9d6" font-size="8.5">0%</text><text x="342" y="421" fill="#8fa9d6" font-size="8.5" text-anchor="end">100%</text></g>
    <g><rect x="34" y="444" width="322" height="126" rx="14" fill="url(#card)" stroke="#315b91"/><rect x="46" y="457" width="28" height="28" rx="8" fill="#174078" stroke="#3867a1"/><text x="60" y="477" font-size="15" text-anchor="middle">🖱️</text><text x="84" y="469" fill="#f4f7ff" font-size="14" font-weight="700">Sons da interface</text><text x="84" y="491" fill="#b2c5e4" font-size="10">Cliques, seleções e botões do jogo.</text><rect x="84" y="514" width="88" height="31" rx="16" fill="#153e7a" stroke="#67b2ff"/><rect x="90" y="521" width="27" height="17" rx="9" fill="#347bd3"/><circle cx="109" cy="529.5" r="6.5" fill="#e3f1ff"/><text x="124" y="534" fill="#dceaff" font-size="9" font-weight="700">Ligados</text></g>
    <g><rect x="34" y="581" width="322" height="126" rx="14" fill="url(#card)" stroke="#315b91"/><rect x="46" y="594" width="28" height="28" rx="8" fill="#174078" stroke="#3867a1"/><text x="60" y="614" font-size="15" text-anchor="middle">🔇</text><text x="84" y="606" fill="#f4f7ff" font-size="14" font-weight="700">Silenciar todos</text><text x="84" y="628" fill="#b2c5e4" font-size="10">Pausa todos os sons sem perder seus volumes.</text><rect x="84" y="651" width="93" height="31" rx="16" fill="#0b1735" stroke="#4e6b99"/><rect x="90" y="658" width="27" height="17" rx="9" fill="#273c65"/><circle cx="99" cy="666.5" r="6.5" fill="#a8bfed"/><text x="124" y="671" fill="#9db0d2" font-size="9" font-weight="700">Desligado</text></g>
  </g>
  <text x="195" y="782" text-anchor="middle" fill="#7391c0" font-family="Arial, sans-serif" font-size="10">Prévia mobile · RocketBloom</text>
</svg>
