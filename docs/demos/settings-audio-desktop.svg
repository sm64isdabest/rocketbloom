<svg xmlns="http://www.w3.org/2000/svg" width="570" height="900" viewBox="0 0 570 900" role="img" aria-labelledby="title desc">
  <title id="title">Prévia desktop das configurações de áudio do RocketBloom</title>
  <desc id="desc">Painel azul marinho com abas e quatro cartões de áudio: música, efeitos sonoros, sons da interface e silenciar todos.</desc>
  <defs>
    <linearGradient id="space" x2="0" y2="1"><stop stop-color="#02091a"/><stop offset=".56" stop-color="#061438"/><stop offset="1" stop-color="#0b1743"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#061536" stop-opacity=".92"/><stop offset="1" stop-color="#030b26" stop-opacity=".96"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#0a2456"/><stop offset="1" stop-color="#061535"/></linearGradient>
    <linearGradient id="track" x2="1"><stop stop-color="#729cff"/><stop offset="55%" stop-color="#729cff"/><stop offset="55%" stop-color="#0a3c9d"/><stop offset="1" stop-color="#0a3c9d"/></linearGradient>
    <linearGradient id="switch" x2="1"><stop stop-color="#a8c6ff"/><stop offset="1" stop-color="#4b77ca"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#00091f" flood-opacity=".58"/></filter>
  </defs>
  <rect width="570" height="900" fill="url(#space)"/>
  <g opacity=".45" filter="url(#blur)"><circle cx="280" cy="329" r="55" fill="#27b456"/><circle cx="320" cy="275" r="34" fill="#ed4b56"/><circle cx="373" cy="400" r="25" fill="#447bff"/><circle cx="188" cy="444" r="20" fill="#f6bf30"/></g>
  <rect x="70" y="32" width="420" height="824" rx="23" fill="url(#panel)" stroke="#078eff" stroke-width="4" filter="url(#glow)"/>
  <g filter="url(#shadow)"><path d="M97 60l15-17 18 17 17-17 15 17-17 17 17 17-15 15-17-17-18 17-15-15 17-17z" fill="#d82024" stroke="#ff6b55" stroke-width="3" stroke-linejoin="round"/><path d="M103 65l39 38M142 65l-39 38" stroke="#a80f18" stroke-width="8" stroke-linecap="round"/></g>
  <rect x="124" y="132" width="322" height="46" rx="12" fill="#030d27" stroke="#264674"/>
  <rect x="129" y="137" width="71" height="36" rx="8" fill="#1c4a8c" stroke="#7ab8ff"/>
  <g font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#a9bad9" text-anchor="middle"><text x="164" y="159" fill="#f2f7ff">Áudio</text><text x="235" y="159">Jogabilidade</text><text x="317" y="159">Acessibilidade</text><text x="402" y="159">Informações</text></g>
  <g font-family="Arial, sans-serif">
    <g><rect x="122" y="194" width="326" height="116" rx="14" fill="url(#card)" stroke="#315b91"/><rect x="136" y="209" width="30" height="30" rx="9" fill="#174078" stroke="#3867a1"/><text x="151" y="230" font-size="17" text-anchor="middle">🎵</text><text x="178" y="221" fill="#f4f7ff" font-size="16" font-weight="700">Música</text><text x="430" y="221" fill="#a9c9ff" font-size="12" text-anchor="end">35%</text><text x="178" y="244" fill="#b2c5e4" font-size="10.5">Trilha ambiente das suas viagens espaciais.</text><rect x="178" y="264" width="252" height="23" rx="12" fill="url(#track)"/><circle cx="266" cy="275.5" r="11" fill="url(#switch)" stroke="#c1d8ff" stroke-width="2" filter="url(#shadow)"/></g>
    <g><rect x="122" y="337" width="326" height="116" rx="14" fill="url(#card)" stroke="#315b91"/><rect x="136" y="352" width="30" height="30" rx="9" fill="#174078" stroke="#3867a1"/><text x="151" y="373" font-size="17" text-anchor="middle">✨</text><text x="178" y="364" fill="#f4f7ff" font-size="16" font-weight="700">Efeitos sonoros</text><text x="430" y="364" fill="#a9c9ff" font-size="12" text-anchor="end">55%</text><text x="178" y="387" fill="#b2c5e4" font-size="10.5">Moedas, obstáculos, poderes e conquistas.</text><rect x="178" y="407" width="252" height="23" rx="12" fill="url(#track)"/><circle cx="317" cy="418.5" r="11" fill="url(#switch)" stroke="#c1d8ff" stroke-width="2" filter="url(#shadow)"/></g>
    <g><rect x="122" y="480" width="326" height="104" rx="14" fill="url(#card)" stroke="#315b91"/><rect x="136" y="495" width="30" height="30" rx="9" fill="#174078" stroke="#3867a1"/><text x="151" y="516" font-size="16" text-anchor="middle">🖱️</text><text x="178" y="507" fill="#f4f7ff" font-size="15" font-weight="700">Sons da interface</text><text x="178" y="530" fill="#b2c5e4" font-size="10.5">Cliques, seleções e botões do jogo.</text><rect x="178" y="545" width="83" height="28" rx="14" fill="#153e7a" stroke="#67b2ff"/><rect x="184" y="551" width="26" height="16" rx="8" fill="#347bd3"/><circle cx="202" cy="559" r="6" fill="#e3f1ff"/><text x="216" y="563" fill="#dceaff" font-size="9" font-weight="700">Ligados</text></g>
    <g><rect x="122" y="610" width="326" height="104" rx="14" fill="url(#card)" stroke="#315b91"/><rect x="136" y="625" width="30" height="30" rx="9" fill="#174078" stroke="#3867a1"/><text x="151" y="646" font-size="16" text-anchor="middle">🔇</text><text x="178" y="637" fill="#f4f7ff" font-size="15" font-weight="700">Silenciar todos</text><text x="178" y="660" fill="#b2c5e4" font-size="10.5">Pausa todos os sons sem perder seus volumes.</text><rect x="178" y="675" width="88" height="28" rx="14" fill="#0b1735" stroke="#4e6b99"/><rect x="184" y="681" width="26" height="16" rx="8" fill="#273c65"/><circle cx="192" cy="689" r="6" fill="#a8bfed"/><text x="216" y="693" fill="#9db0d2" font-size="9" font-weight="700">Desligado</text></g>
  </g>
  <text x="285" y="820" text-anchor="middle" fill="#7391c0" font-family="Arial, sans-serif" font-size="11">Prévia de organização · RocketBloom</text>
</svg>
